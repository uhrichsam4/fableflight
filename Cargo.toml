[package]
name = "fablegame"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
earcutr = "0.5.0"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
ab_glyph = "0.2.32"
env_logger = "0.11.11"
flate2 = "1.1.11"
gilrs = "0.11.2"
glam = { version = "0.34.3", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
parking_lot = "0.13.0"
pollster = "1.0.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde_json = "1.0.154"
ureq = "3.5.1"
wgpu = { version = "30", features = ["spirv"] }
winit = "0.30"

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-in", "msl-out"] }
